version: '3'
tasks:
  test:
    cmds: [go test ./...]
  vet:
    cmds: [go vet ./...]
  build:
    cmds: [go build -trimpath -o triage .]
  ui:
    desc: Regenerate server templates and embedded browser assets
    cmds:
      - npm ci --ignore-scripts
      - npm run vendor:htmx
      - npm run build:css
      - go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate -path internal/web
  demo:
    cmds: [docker compose up --build]
  helm-lint:
    cmds: [helm lint deploy/helm/siem-triage-agent]
  report:
    cmds: [go run . report --db data/triage.db --period 7d --format md --out weekly.md]
  benchmark:
    desc: Run the 100k-alert correlation benchmark once
    cmds: [go test -run '^$' -bench '^BenchmarkGroup100k$' -benchtime=1x -count=1]
