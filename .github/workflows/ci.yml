name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.4
        env:
          discovery.type: single-node
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          DISABLE_SECURITY_PLUGIN: 'true'
          OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports:
          - 19203:9200
        options: >-
          --health-cmd "curl --fail --silent http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      TRIAGE_TEST_OPENSEARCH_URL: http://127.0.0.1:19203
      TRIAGE_RUNTIME_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify generated and vendored UI
        run: |
          npm ci --ignore-scripts
          npm run vendor:htmx
          npm run build:css
          go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate -path internal/web
          git diff --exit-code -- internal/web/static internal/web/views_templ.go
      - run: go test -race ./... -count=1
      - name: Repeat real source pagination checks
        run: go test -race ./internal/ingest -run TestOpenSearchEqualTimestampPaginationAndRestart -count=25
      - run: go vet ./...
      - run: go build -trimpath ./...
      - name: Compose demo smoke test
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose down -v' EXIT
          docker compose build
          TRIAGE_PORT=18083 docker compose up -d
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18083/health | grep -q '"status":"ok"'; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18083/stats | grep -q 'Dashboard'
          test "$(curl --fail --silent http://127.0.0.1:18083/api/incidents | grep -o '5710' | wc -l)" -ge 1
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=5m --disable=errcheck
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/siem-triage-agent
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: anchore/sbom-action@v0
        with:
          path: ./
          artifact-name: triage-sbom.spdx.json
          upload-artifact: true
