server:
  listen: ":8080"
storage:
  path: data/triage.db
  retention:
    alerts: 720h
    llm_calls: 2160h
correlation:
  window: 15m
  max_incident_age: 6h
  suppressions_file: configs/suppressions.example.yaml
triage:
  llm_threshold: 40
  mode: rule-only # set to llm to enable the first configured provider
  providers:
    - name: local
      type: ollama
      base_url: http://localhost:11434
      model: qwen2.5:7b
    # - name: cloud
    #   type: anthropic
    #   base_url: https://api.anthropic.com
    #   model: claude-3-5-haiku-latest
    #   api_key_env: ANTHROPIC_API_KEY
enrichment:
  assets_file: configs/assets.example.yaml
  ioc_file: configs/ioc.example.yaml
  geoip_file: ""
  abuseipdb:
    base_url: https://api.abuseipdb.com/api/v2
    api_key_env: ABUSEIPDB_API_KEY
  virustotal:
    base_url: https://www.virustotal.com/api/v3
    api_key_env: VIRUSTOTAL_API_KEY
