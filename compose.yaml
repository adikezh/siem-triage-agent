services:
  triage:
    build: .
    ports: ["${TRIAGE_PORT:-8080}:8080"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - triage-data:/app/data
    command: ["demo", "--listen", ":8080", "--db", "/app/data/triage.db"]
volumes:
  triage-data:
